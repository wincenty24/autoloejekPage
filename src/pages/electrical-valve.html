<section class="page-intro"><p class="eyebrow" data-i18n="vizElectricalChoice"></p><h1 data-i18n="vizElectricValve"></h1></section>
<div class="electrical-simulator" data-electrical-simulator data-valve-simulator>
  <p class="module-instructions"><span data-click-hint-icon aria-hidden="true"></span><span data-i18n="vizElectricValveFuseHint"></span></p>
  <label class="setup-option">
    <span data-i18n="vizElectricVin"></span>
    <select id="pcb-voltage">
      <option value="9">9 V DC</option>
      <option value="12" selected>12 V DC</option>
      <option value="24">24 V DC</option>
    </select>
  </label>
  <div class="valve-board-header">
    <span data-i18n="vizElectricBoardTitle"></span>
    <button type="button" class="pcb-relay-button" id="valve-relay"><span data-relay-icon aria-hidden="true"></span><span data-relay-label></span></button>
  </div>
  <svg class="valve-assembly" viewBox="0 0 720 1140" role="group" data-i18n-aria-label="vizElectricValve">
    <g id="pcb-diagram" data-i18n-aria-label="vizElectricBoardTitle"></g>
    <g data-valve-wires></g>
    <g class="valve-upstream" aria-hidden="true">
      <path class="pump-jet" d="M107 1081H250"/>
      <path class="pump-droplets" d="M107 1081H250"/>
    </g>
    <g class="valve-water" aria-hidden="true">
      <path class="pump-jet" d="M465 1081H615"/>
      <path class="pump-droplets" d="M465 1081H615"/>
    </g>
    <image href="assets/visualization/solenoid-valve-external-front.png" x="210" y="840" width="300" height="300" role="img" data-i18n-aria-label="vizValveExternalAlt"/>
  </svg>
  <p><output id="valve-status" aria-live="polite"></output></p>
  <p><output id="relay-fuse-status" aria-live="polite"></output></p>
  <div class="controls">
    <button type="button" id="relay-fuse"></button>
  </div>
</div>
