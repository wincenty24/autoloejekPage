<section class="page-intro"><p class="eyebrow" data-i18n="vizElectricalChoice"></p><h1 data-i18n="vizElectricMeter"></h1><p class="lead" data-i18n="vizElectricMeterLead"></p></section>
<div class="electrical-simulator" data-electrical-simulator data-meter-simulator>
  <p class="module-instructions"><span data-click-hint-icon aria-hidden="true"></span><span data-i18n="vizElectricMeterFuseHint"></span></p>
  <div class="setup">
  <label class="setup-option">
    <span data-i18n="vizElectricMeterWires"></span>
    <select id="electric-meter-wires">
      <option value="2" data-i18n="vizElectricMeterTwoWires"></option>
      <option value="3" data-i18n="vizElectricMeterThreeWires"></option>
    </select>
  </label>
  <label class="setup-option" id="electric-meter-model-picker">
    <span data-i18n="vizMeterType"></span>
    <select id="electric-meter-type">
      <option value="hall" data-wire-counts="3" data-i18n="vizMeterTypeHall" hidden disabled></option>
      <option value="compact" data-wire-counts="2" data-i18n="vizMeterTypeCompact" selected></option>
      <option value="multi-jet" data-wire-counts="3" data-i18n="vizMeterTypeMultiJet"></option>
    </select>
  </label>
  </div>
  <p id="meter-wiring-hint"></p>
  <svg class="valve-assembly" viewBox="0 0 720 1140" role="group" data-i18n-aria-label="vizElectricMeter">
    <defs>
      <g id="meter-pickup-housing">
        <rect x="-21" y="-12" width="44" height="24" rx="5" fill="#283440" stroke="#637483"/>
        <rect x="-15" y="-10" width="33" height="20" rx="3" fill="#111923"/>
        <path d="M-9-6H12" stroke="#435463" stroke-width="2" stroke-linecap="round"/>
        <rect x="18" y="-5" width="11" height="10" rx="2" fill="#374855"/>
      </g>
    </defs>
    <g id="pcb-diagram" data-i18n-aria-label="vizElectricBoardTitle"></g>
    <image data-electric-meter="hall" href="assets/visualization/flow-sensor-black-external-front.png" x="210" y="840" width="300" height="300" role="img" data-i18n-aria-label="partHallMeter" hidden/>
    <g data-meter-wires></g>
    <image data-electric-meter="compact" href="assets/visualization/water-meter-external-front.png" x="210" y="840" width="300" height="300" role="img" data-i18n-aria-label="partMeter"/>
    <g data-electric-meter="compact" role="img" data-i18n-aria-label="vizElectricMeterReedPickup">
      <path d="M322 836v25h104q17 0 32 15" fill="none" stroke="#67b9ff" stroke-width="3" stroke-linejoin="round"/>
      <path class="meter-pickup-signal" d="M362 836v13h67q20 0 30 26" fill="none" stroke="#ffd369" stroke-width="3" stroke-linejoin="round"/>
      <path d="M422 947c42 8 55-29 37-72" fill="none" stroke="#263441" stroke-width="9" stroke-linecap="round"/>
      <path d="M422 947c42 8 55-29 37-72" fill="none" stroke="#b7c6ce" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(403 925) rotate(42)">
        <title data-i18n="vizElectricMeterReedPickup"></title>
        <use href="#meter-pickup-housing"/>
      </g>
    </g>
    <image data-electric-meter="multi-jet" href="assets/visualization/water-meter-multijet-external-front.png" x="210" y="840" width="300" height="300" role="img" data-i18n-aria-label="partMultiJetMeter" hidden/>
    <g data-electric-meter="multi-jet-powered" role="img" data-i18n-aria-label="vizElectricMeterPoweredPickup" hidden>
      <path d="M474 861v9q0 6 6 10" fill="none" stroke="#67b9ff" stroke-width="3"/>
      <path class="meter-pickup-signal" d="M480 861v19" fill="none" stroke="#ffd369" stroke-width="3"/>
      <path class="meter-pickup-supply" d="M486 861v9q0 6-6 10" fill="none" stroke="#ff6479" stroke-width="3"/>
      <path d="M480 880C514 927 470 1027 399 987" fill="none" stroke="#141e27" stroke-width="8" stroke-linecap="round"/>
      <path d="M480 880C514 927 470 1027 399 987" fill="none" stroke="#53616b" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(379 969) rotate(42)">
        <title data-i18n="vizElectricMeterPoweredPickup"></title>
        <use href="#meter-pickup-housing"/>
      </g>
    </g>
    <foreignObject x="505" y="900" width="205" height="190">
      <div xmlns="http://www.w3.org/1999/xhtml" class="meter-pulse-controls">
        <button type="button" id="meter-pulse-toggle"></button>
        <output id="meter-pulse-count"></output>
      </div>
    </foreignObject>
  </svg>
  <p><output id="meter-fuse-status" aria-live="polite"></output></p>
  <p id="meter-fuse-explanation" data-i18n="vizElectricMeterUncountedPulses" hidden></p>
  <div class="controls"><button type="button" id="meter-fuse"></button></div>
</div>
