  <main>
<a class="viz-back" href="electrical-visualization.html"><span aria-hidden="true">←</span><span data-i18n="vizElectricBack"></span></a>
<section class="page-intro"><p class="eyebrow" data-i18n="navVisualization"></p><h1 data-i18n="vizElectricPump"></h1><p class="lead" data-i18n="vizElectricLead"></p></section>
<div class="electrical-simulator" data-electrical-simulator data-pump-simulator>
<p class="module-instructions"><span data-click-hint-icon aria-hidden="true"></span><span data-i18n="vizElectricClickHint"></span></p>
<p><label for="motor-lines" data-i18n="vizElectricLines"></label>
<select id="motor-lines">
<option value="" data-i18n="vizElectricChoose"></option>
<option value="1" data-i18n="vizElectricOne"></option>
<option value="2" data-i18n="vizElectricTwo"></option>
<option value="3" data-i18n="vizElectricThree"></option>
</select></p>
<label class="setup-option">
  <span data-i18n="vizElectricVin"></span>
  <select id="pcb-voltage" aria-describedby="pcb-voltage-hint">
    <option value="9">9 V DC</option>
    <option value="12" selected>12 V DC</option>
    <option value="24">24 V DC</option>
  </select>
</label>
<p id="pcb-voltage-hint" data-i18n="vizElectricVinHint"></p>
<div id="circuit" hidden>
  <div class="setup">
    <label class="setup-option">
      <span data-i18n="vizElectricResidual"></span>
      <select id="residual-protection">
        <option value="none" data-i18n="vizElectricNone"></option>
        <option value="rccb">RCCB</option>
        <option value="rcbo">RCBO</option>
      </select>
    </label>
    <label class="setup-option">
      <span data-i18n="vizElectricMcb"></span>
      <select id="use-mcb">
        <option value="on" data-i18n="vizElectricMcbEnabled"></option>
        <option value="off" data-i18n="vizElectricMcbDisabled"></option>
      </select>
    </label>
  </div>
  <p><output id="motor-status" aria-live="polite"></output></p>
  <div class="wiring" id="wiring" role="region" tabindex="0" data-i18n-aria-label="vizElectricalChoice"></div>
  <div id="catalog"></div>
</div>
<div class="pcb-model" id="pcb-preview" aria-labelledby="pcb-title">
  <h2 id="pcb-title" data-i18n="vizElectricBoardTitle"></h2>
  <p data-i18n="vizElectricBoardHint"></p>
  <div id="pcb-diagram"></div>
</div>
</div>
</main>
