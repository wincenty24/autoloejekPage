<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autolejek</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Autolejek</a>
    <nav aria-label="Główna nawigacja" data-i18n-aria-label="navigationLabel">
      <a class="active" href="index.html" aria-current="page" data-i18n="navHome"></a>
      <a href="about-project.html" data-i18n="navAbout"></a><a href="build-it-yourself.html" data-i18n="navBuild"></a><a href="configure-yourself.html" data-i18n="navConfigure"></a><a href="manual.html" data-i18n="navManual"></a><a href="projects.html" data-i18n="navProjects"></a><a href="contact.html" data-i18n="navContact"></a>
    </nav>
    <div class="language-picker"><label for="language" data-i18n="languageLabel"></label><select id="language" aria-label="Wybierz język" data-i18n-aria-label="languageLabel"></select></div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy">
        <h1 data-i18n="homeTitle"></h1>
        <p class="lead" data-i18n="homeLead"></p>
      </div>
      <img class="hero-image" src="assets/mainPage/autolejek-controller.png" width="941" height="1672" alt="" data-i18n-alt="homeHeroAlt">
    </section>

    <section class="scroll-story" data-scroll-story>
      <div class="story-stage" aria-hidden="true">
        <img class="story-visual is-active" data-story-visual src="assets/mainPage/tractor-spraying-field.jpg" loading="lazy" decoding="async" alt="">
        <img class="story-visual story-visual-irrigation" data-story-visual src="assets/mainPage/field-irrigation-sprinkler.jpg" loading="lazy" decoding="async" alt="">
        <img class="story-visual story-visual-tap" data-story-visual src="assets/mainPage/outdoor-water-tap.jpg" loading="lazy" decoding="async" alt="">
        <div class="story-progress"><span data-story-progress></span></div>
        <span class="story-counter"><span data-story-current>01</span> / 03</span>
      </div>

      <div class="story-chapters">
        <article class="story-step is-active" data-story-step>
          <div class="story-card">
            <span class="story-number">01</span>
            <h2 data-i18n="storyProblemTitle"></h2>
            <p class="story-answer" data-i18n="storyProblemLead"></p>
            <p class="story-followup" data-i18n="storyProblemText"></p>
          </div>
        </article>

        <article class="story-step" data-story-step>
          <div class="story-card">
            <span class="story-number">02</span>
            <h2 data-i18n="storyMeasureTitle"></h2>
            <p data-i18n="storyMeasureText"></p>
          </div>
        </article>

        <article class="story-step" data-story-step>
          <div class="story-card">
            <span class="story-number">03</span>
            <h2 data-i18n="storySourceTitle"></h2>
            <p class="story-answer" data-i18n="storySourceLead"></p>
            <p class="story-followup" data-i18n="storySourceText"></p>
          </div>
        </article>

      </div>
    </section>

    <div class="about-project-cta">
      <a class="about-project-link" href="about-project.html">
        <span data-i18n="storyAboutLink"></span>
        <span aria-hidden="true">→</span>
      </a>
    </div>
  </main>
  <footer><span>© <span data-current-year></span> Autolejek</span><a href="mailto:autolejek@gmail.com">autolejek@gmail.com</a></footer>
  <script src="site.js"></script>
</body></html>
