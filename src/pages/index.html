    <section class="hero">

    <section class="scroll-story" data-scroll-story>
      <div class="story-stage">
        <img class="story-visual story-visual-sprayer is-active" data-story-visual src="assets/mainPage/tractor-spraying-field.jpg" loading="lazy" decoding="async" alt="">

        <span class="story-counter"><span data-story-current>01</span> / 03</span>
      </div>

      <div class="story-chapters">
        <article class="story-step is-active" data-story-step>
          <figure class="story-mobile-media"><img src="assets/mainPage/tractor-spraying-field.jpg" loading="lazy" decoding="async" alt="" width="960" height="640"></figure>
          <div class="story-card">
            <h2 data-i18n="storyProblemTitle"></h2>
            <p class="story-answer" data-i18n="storyProblemLead"></p>
            <p class="story-followup" data-i18n="storyProblemText"></p>
          </div>
        </article>

        <article class="story-step" data-story-step>
          <figure class="story-mobile-media"><img src="assets/mainPage/field-irrigation-sprinkler.jpg" loading="lazy" decoding="async" alt="" width="960" height="640"></figure>
          <div class="story-card">
            <h2 data-i18n="storyMeasureTitle"></h2>
            <p data-i18n="storyMeasureText"></p>
          </div>
        </article>

        <article class="story-step" data-story-step>
          <figure class="story-mobile-media"><img src="assets/mainPage/outdoor-water-tap.jpg" loading="lazy" decoding="async" alt="" width="960" height="640"></figure>
          <div class="story-card">
            <h2 data-i18n="storySourceTitle"></h2>
            <p class="story-answer" data-i18n="storySourceLead"></p>
            <p class="story-followup" data-i18n="storySourceText"></p>
          </div>
        </article>

      </div>
