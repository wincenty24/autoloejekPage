  <main>
    <section class="page-intro">
      <h1 id="meter-catalog-title" data-i18n="meterCatalogTitle"></h1>
      <p class="lead" data-i18n="meterCatalogLead"></p>
      <p><a href="water-meter-finder.html" data-i18n="meterConfiguratorTitle"></a></p>
    </section>
    <section class="technical-guide meter-catalog" aria-labelledby="meter-catalog-title">
      <p id="meter-catalog-note" data-i18n="meterCatalogNote"></p>
      <div class="meter-catalog-sort" hidden>
        <label for="meter-catalog-sort" data-i18n="meterSortLabel"></label>
        <select id="meter-catalog-sort">
          <option value="default" data-i18n="meterSortDefault"></option>
          <option value="dn-asc" data-i18n="meterSortDnAsc"></option>
          <option value="dn-desc" data-i18n="meterSortDnDesc"></option>
          <option value="q3-asc" data-i18n="meterSortQ3Asc"></option>
          <option value="q3-desc" data-i18n="meterSortQ3Desc"></option>
        </select>
      </div>
      <div class="meter-catalog-slider" hidden>
        <label for="meter-catalog-position" data-i18n="meterCatalogScrollLabel"></label>
        <input id="meter-catalog-position" type="range" min="0" max="100" value="0" aria-controls="meter-catalog-table">
      </div>
      <div id="meter-catalog-table" class="table-scroll" tabindex="0" role="region" aria-labelledby="meter-catalog-title" aria-describedby="meter-catalog-note">
        <table>
          <thead>
            <tr>
              <th scope="col" data-i18n="meterCatalogModel"></th>
              <th scope="col">DN</th>
              <th scope="col" data-i18n="meterCatalogConnection"></th>
              <th scope="col">Q1 [L/min]</th>
              <th scope="col">Q2 [L/min]</th>
              <th scope="col">Q3 [L/min]</th>
              <th scope="col">Q4 [L/min]</th>
              <th scope="col" data-i18n="meterCatalogTemperature"></th>
              <th scope="col" data-i18n="meterCatalogPulse"></th>
              <th scope="col" data-i18n="meterCatalogPressureLoss"></th>
            </tr>
          </thead>
          <tbody><!-- METER_CATALOG_ROWS --></tbody>
        </table>
      </div>
      <p class="table-note" data-i18n="meterCatalogAndromedaNote"></p>
      <p data-i18n="meterCatalogModulesNote"></p>
    </section>
  </main>
  <script src="meter-configurator/catalog-scroll.js" defer></script>
