<section class="page-intro"><p class="eyebrow" data-i18n="navVisualization"></p><h1 data-i18n="waterHammerTitle"></h1><p class="lead" data-i18n="waterHammerLead"></p></section>
<section class="simulator" data-i18n-aria-label="waterHammerSimulator">
<div class="schematic">
<h2 data-i18n="waterHammerLayout"></h2>
<canvas class="diagram" id="diagram" width="900" height="590" role="img" data-i18n-aria-label="waterHammerDiagram"></canvas>
<div class="legend"><span data-i18n="waterHammerFlow"></span><span data-i18n="waterHammerWave"></span></div>

</div>
<div>
<div class="counter" id="counter">
<div><span data-i18n="waterHammerPulses"></span><strong id="count" aria-live="polite">00</strong></div>
<div><span data-i18n="waterHammerIndicated"></span><strong id="indicated">0 l</strong></div>
<div><span data-i18n="waterHammerNet"></span><strong id="net">0 l</strong></div>
</div>

<section class="status" aria-live="polite">
<div class="caption"><span data-i18n="waterHammerValve"></span></div>
<h2 id="title"></h2>
<p id="description"></p>
</section>
<div class="track" aria-hidden="true"><div class="progress" id="progress"></div></div>
<div class="settings">
<label><span data-i18n="waterHammerTarget"></span>
<input id="target" type="number" min="0" step="any" value="1" inputmode="decimal" required>
</label>
<label for="speed"><span><span data-i18n="waterHammerSpeed"></span> <output id="speed-value" for="speed">1×</output></span>
<input id="speed" type="range" min="1" max="2" step="0.1" value="1">
</label>
<div class="calibration">
<label><span data-i18n="waterHammerCalibration"></span>
<select id="calibration-unit">
<option value="per-liter" data-i18n="waterHammerPerLiter"></option>
<option value="per-pulse" data-i18n="waterHammerPerPulse"></option>
</select>
</label>
<label><span data-i18n="waterHammerValue"></span>
<input id="calibration-value" type="number" min="1" max="10" step="1" value="1" required>
</label>
</div>
</div>
<p class="note"><span data-i18n="waterHammerPulseTarget"></span> <output id="target-pulses" for="target calibration-value calibration-unit">1</output></p>
<div class="controls">
<button id="start" type="button" data-i18n="waterHammerStart"></button>
<button id="stop" type="button" disabled data-i18n="waterHammerStop"></button>
<button id="reset" type="button" data-i18n="waterHammerReset"></button>
</div>
<p class="note" data-i18n="waterHammerNote0"></p>

</div>
</section>
<section class="explanation" aria-labelledby="explanation-title">
