  <title id="title">Animowany schemat dwóch obwodów przekaźnika</title>
  <desc id="description">Obwód sterowania DC i odseparowany obwód obciążenia AC. Przekaźnik przełącza COM między NC i NO.</desc>
  <style>
svg{background:#fbfcff}text{font-family:Inter,Arial,sans-serif}.wire{fill:none;stroke:#475169;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.body{fill:#fff0a8;stroke:#30394d;stroke-width:5}.terminal,.switch-terminal{fill:#30394d}.terminal-label{fill:#30394d;font-size:24px;font-weight:800}.source-label{fill:#626b7c;font-size:18px;font-weight:700}.polarity{fill:#30394d;font-size:26px;font-weight:700}.coil-core{fill:#fff7d1;stroke:#30394d;stroke-width:5;animation:coil 5s ease-in-out infinite}.coil-winding{fill:none;stroke:#30394d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.coil-label{fill:#30394d;font-size:17px;font-weight:700}.mechanical-link{fill:none;stroke:#68738a;stroke-width:3;stroke-dasharray:8 8}.arm{stroke:#3563e9;stroke-width:9;stroke-linecap:round;transform-origin:650px 400px;transform-box:view-box;animation:arm 5s ease-in-out infinite}.control-switch{stroke:#30394d;stroke-width:7;stroke-linecap:round;transform-origin:250px 190px;transform-box:view-box;animation:control-switch 5s ease-in-out infinite}.battery,.lamp,.ac-source,.filament,.ac-wave{stroke:#30394d;stroke-width:5;stroke-linecap:round}.battery{stroke-width:6}.lamp-nc{fill:#ffd95a;animation:lamp-nc 5s ease-in-out infinite}.lamp-no{fill:#eef1f6;animation:lamp-no 5s ease-in-out infinite}.filament,.ac-wave{fill:none}.ac-source{fill:#fff0a8}.lamp-rays line{stroke:#e0a527;stroke-width:5;stroke-linecap:round}.rays-nc{animation:rays-nc 5s ease-in-out infinite}.rays-no{opacity:0;animation:rays-no 5s ease-in-out infinite}.current{fill:none;stroke:#e0a527;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.current-control{opacity:0;animation:current-control 5s ease-in-out infinite}.current-nc{opacity:.28;animation:current-nc 5s ease-in-out infinite}.current-no{opacity:0;animation:current-no 5s ease-in-out infinite}.state-title{fill:#172033;font-size:23px;font-weight:800}.state-path{fill:#3563e9;font-size:20px;font-weight:800}.state-resting{animation:state-resting 5s ease-in-out infinite}.state-energized{opacity:0;animation:state-energized 5s ease-in-out infinite}.terminal-nc{animation:terminal-nc 5s ease-in-out infinite}.terminal-no{animation:terminal-no 5s ease-in-out infinite}
@keyframes arm{0%,40%,100%{transform:rotate(0)}50%,90%{transform:rotate(43.5deg)}}@keyframes control-switch{0%,40%,100%{transform:rotate(0)}50%,90%{transform:rotate(20.5deg)}}@keyframes coil{0%,40%,100%{fill:#fff7d1}50%,90%{fill:#bcd0ff}}@keyframes terminal-nc{0%,40%,100%{fill:#3563e9}50%,90%{fill:#30394d}}@keyframes terminal-no{0%,40%,100%{fill:#30394d}50%,90%{fill:#3563e9}}@keyframes lamp-nc{0%,40%,100%{fill:#ffd95a}50%,90%{fill:#eef1f6}}@keyframes lamp-no{0%,40%,100%{fill:#eef1f6}50%,90%{fill:#ffd95a}}@keyframes rays-nc{0%,40%,100%{opacity:1}50%,90%{opacity:0}}@keyframes rays-no{0%,40%,100%{opacity:0}50%,90%{opacity:1}}@keyframes current-control{0%,40%,100%{opacity:0}50%,90%{opacity:.28}}@keyframes current-nc{0%,40%,100%{opacity:.28}50%,90%{opacity:0}}@keyframes current-no{0%,40%,100%{opacity:0}50%,90%{opacity:.28}}@keyframes state-resting{0%,40%,100%{opacity:1}46%,94%{opacity:0}}@keyframes state-energized{0%,40%,100%{opacity:0}50%,90%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes arm{0%,40%,100%{transform:rotate(0)}50%,90%{transform:rotate(45.9deg)}}
</style>
